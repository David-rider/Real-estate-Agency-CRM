name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "ERROR: VERCEL_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          echo "Triggering Vercel deploy hook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Deploy hook triggered successfully!"
          else
            echo "ERROR: Deploy hook returned HTTP $HTTP_CODE"
            exit 1
          fi
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
