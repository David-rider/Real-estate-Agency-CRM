name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "Deploy hook triggered successfully"
